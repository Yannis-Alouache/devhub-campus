name: build-images

# Squelette à compléter — étape 3 (build) et défi de l'étape 3 (signature cosign).
#
# Principe GitOps : la CI BUILD et PUSH une image. C'est tout.
# Elle ne touche PAS au cluster. C'est ArgoCD qui réagira au nouveau tag.

on:
  push:
    branches: ["main", "feature/**"]
    paths:
      - "services/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # nécessaire pour pousser sur ghcr.io
  id-token: write          # nécessaire pour la signature cosign (OIDC keyless)

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [annuaire, planning, notif]
    steps:
      - uses: actions/checkout@v4

      - name: Normalize registry owner
        id: registry_owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Compute short SHA
        id: short_sha
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Normalize branch tag
        id: branch_tag
        run: |
          value="$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9.-]+/-/g; s/^-+//; s/-+$//; s/\.\.+/./g' \
            | cut -c1-128)"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.registry_owner.outputs.value }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ steps.registry_owner.outputs.value }}/${{ matrix.service }}:${{ steps.short_sha.outputs.value }}
            ghcr.io/${{ steps.registry_owner.outputs.value }}/${{ matrix.service }}:${{ steps.branch_tag.outputs.value }}

      # TODO étape 3 (défi) : ajoutez la signature cosign keyless (OIDC).
      # Indice : utilisez l'action sigstore/cosign-installer puis `cosign sign --yes`.
      #
      # TODO étape 3 (défi) : ajoutez un scan trivy en mode --exit-code=1 sur CRITICAL.
