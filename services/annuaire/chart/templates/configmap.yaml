apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "annuaire.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "annuaire.labels" . | nindent 4 }}
{{- if .Values.configMap.includeLogLevel }}
data:
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
{{- else }}
data: {}
{{- end }}
