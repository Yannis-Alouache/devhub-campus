# Values Helm pour installer ArgoCD lui-même (chart argo/argo-cd).
# Ce fichier est consommé par `make argocd-install`.
#
# Doc du chart : https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
#
# Le but de ce fichier : exposer l'UI via l'ingress-nginx du cluster,
# avec un host `argocd.devhub.local`. Le reste est laissé par défaut.

global:
  domain: argocd.devhub.local

configs:
  params:
    # désactive le TLS interne — l'ingress-nginx est devant pour le HTTPS.
    server.insecure: true
  cm:
    timeout.reconciliation: 180s
    users.anonymous.enabled: "false"
    # Compte local non-admin pour la validation RBAC.
    accounts.developer: login, apiKey

  rbac:
    # Tous les utilisateurs authentifiés voient les Apps du projet devhub,
    # puis les rôles dédiés ajoutent des droits plus fins.
    policy.default: role:authenticated
    policy.matchMode: glob
    policy.csv: |
      p, role:authenticated, applications, get, devhub/*, allow
      p, role:authenticated, projects, get, devhub, allow

      p, role:platform-admin, *, *, *, allow

      # Ici, le compte local `developer` est volontairement borné au service annuaire.
      p, role:developer, applications, get, devhub/*, allow
      p, role:developer, projects, get, devhub, allow
      p, role:developer, logs, get, devhub/*, allow
      p, role:developer, applications, sync, devhub/annuaire*, allow

      g, admin, role:platform-admin
      g, developer, role:developer

notifications:
  enabled: true
  argocdUrl: https://argocd.devhub.local
  metrics:
    enabled: true
  notifiers:
    service.webhook.webhook-site: |
      url: https://webhook.site/7950c1c3-6599-400f-9bd2-56e27479e7e8
      headers:
        - name: Content-Type
          value: application/json
  templates:
    template.sync-failed-webhook: |
      webhook:
        webhook-site:
          method: POST
          body: |
            {
              "application": "{{.app.metadata.name}}",
              "revision": "{{.app.status.sync.revision}}",
              "error": {{ .app.status.operationState.message | toJson }}
            }
  triggers:
    trigger.on-sync-failed-webhook: |
      - description: Send a webhook when an application sync fails
        when: app.status.operationState.phase in ['Error', 'Failed']
        send:
          - sync-failed-webhook

# Garde-fou ressources — utile en TP pour ne pas saturer la machine.
controller:
  metrics:
    enabled: true
  resources:
    requests: { cpu: "50m", memory: "256Mi" }
    limits:   { cpu: "1",   memory: "1Gi" }

server:
  metrics:
    enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.devhub.local
    annotations:
      # ArgoCD termine son propre TLS en interne. On dit à l'ingress
      # de ne pas refaire de TLS terminaison côté server.
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
    tls: false

repoServer:
  metrics:
    enabled: true
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
