# ApplicationSet preview pour planning.
# Une fois annuaire-preview.yaml fait, dupliquez en adaptant.
#
# TODO : à compléter à partir du modèle annuaire.yaml.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: planning-preview
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - scmProvider:
        cloneProtocol: https
        github:
          organization: Yannis-Alouache
          allBranches: true
        filters:
          - repositoryMatch: ^devhub-campus$
            branchMatch: ^feature/.*
            pathsExist:
              - services/planning/chart
  template:
    metadata:
      name: 'planning-preview-{{ .branchNormalized }}'
      labels:
        devhub.io/env: preview
        devhub.io/service: planning
        devhub.io/branch: '{{ .branchNormalized }}'
    spec:
      project: devhub
      source:
        repoURL: '{{ .url }}'
        targetRevision: '{{ .branch }}'
        path: services/planning/chart
        helm:
          valueFiles:
            - values-preview.yaml
          parameters:
            - name: image.tag
              value: '{{ .short_sha_7 }}'
            - name: ingress.host
              value: 'planning-{{ .branchNormalized }}.devhub.local'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'devhub-preview-{{ .branchNormalized }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
