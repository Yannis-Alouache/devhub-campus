# ApplicationSet preview pour planning.
# Meme strategie que pour `annuaire` : previews sur PR GitHub `feature/*`
# vers `main`, sans secret supplementaire tant que le depot reste public.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: planning-preview
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - pullRequest:
        requeueAfterSeconds: 180
        github:
          owner: Yannis-Alouache
          repo: devhub-campus
        filters:
          - branchMatch: ^feature/.*
            targetBranchMatch: ^main$
  template:
    metadata:
      name: 'planning-pr-{{ .number }}'
      labels:
        devhub.io/env: preview
        devhub.io/service: planning
        devhub.io/branch: '{{ .branch_slug }}'
        devhub.io/pr: '{{ .number }}'
    spec:
      project: devhub
      source:
        repoURL: https://github.com/Yannis-Alouache/devhub-campus.git
        targetRevision: '{{ .branch }}'
        path: services/planning/chart
        helm:
          valueFiles:
            - values-preview.yaml
          parameters:
            - name: image.tag
              value: '{{ .head_short_sha_7 }}'
            - name: ingress.host
              value: 'planning-pr-{{ .number }}.devhub.local'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'devhub-preview-pr-{{ .number }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
