# ApplicationSet : annuaire — previews via pull requests GitHub.
#
# Le repo est public mais heberge sur un compte utilisateur GitHub.
# Le generateur `scmProvider.github allBranches` scanne des organisations,
# pas ce cas. On utilise donc `pullRequest`, qui supporte `owner` = user/org.
# En pratique, on branche aussi un token GitHub via Secret pour eviter
# la limite de requetes anonyme de l'API GitHub.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: annuaire-preview
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - pullRequest:
        requeueAfterSeconds: 180
        github:
          owner: Yannis-Alouache
          repo: devhub-campus
          tokenRef:
            secretName: github-token
            key: token
        filters:
          - branchMatch: ^feature/.*
            targetBranchMatch: ^main$
  template:
    metadata:
      name: 'annuaire-preview-{{ .branch_slug }}'
      labels:
        devhub.io/env: preview
        devhub.io/service: annuaire
        devhub.io/branch: '{{ .branch_slug }}'
        devhub.io/pr: '{{ .number }}'
    spec:
      project: devhub
      source:
        repoURL: https://github.com/Yannis-Alouache/devhub-campus.git
        targetRevision: '{{ .branch }}'
        path: services/annuaire/chart
        helm:
          valueFiles:
            - values-preview.yaml
          parameters:
            - name: image.tag
              value: '{{ .head_short_sha_7 }}'
            - name: ingress.host
              value: 'annuaire-preview-{{ .branch_slug }}.devhub.local'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'devhub-preview-{{ .branch_slug }}'
      syncPolicy:
        automated:
          prune: true       # IMPORTANT : indispensable pour nettoyer les previews
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
